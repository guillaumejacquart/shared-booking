name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm # natif ARM64, pas de QEMU
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64 # VPS Oracle Ampere
          push: true
          tags: ghcr.io/guillaumejacquart/shared-booking:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
