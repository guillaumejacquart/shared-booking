name: Verify

on:
  pull_request:
  workflow_call:
    inputs:
      checks:
        description: Run the configured verification checks.
        required: false
        type: boolean
        default: true
      e2e:
        description: Run Playwright end-to-end tests.
        required: false
        type: boolean
        default: false
      e2eCommand:
        description: Command used for end-to-end tests.
        required: false
        type: string
        default: npm run test:e2e

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve policy base
        if: inputs.checks != false
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          echo "FACTORY_BASE_REF=$base" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: inputs.checks != false
        run: npm ci

      - name: Verify
        if: inputs.checks != false
        run: npm run verify

      - name: Install dependencies for E2E only
        if: inputs.e2e && inputs.checks == false
        run: npm ci

      - name: Install Playwright browsers
        if: inputs.e2e
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: inputs.e2e
        run: ${{ inputs.e2eCommand }}

      - name: Upload Playwright report
        if: failure() && inputs.e2e
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload factory run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run
          path: factory-run.json
          if-no-files-found: ignore
          retention-days: 30
