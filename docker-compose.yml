services:
  shared-booking:
    image: ghcr.io/guillaumejacquart/shared-booking:latest
    restart: unless-stopped
    # Secrets live only on the VPS, never in git.
    env_file:
      - /home/ubuntu/docker/services/shared-booking.env
    environment:
      - NODE_ENV=production
      - SQLITE_PATH=/app/data/shared-booking.db
      # Domaine canonique (liens emails, OAuth). Ancien domaine gardé en alias
      # Traefik le temps de la transition ; à retirer plus tard (voir README).
      - BETTER_AUTH_URL=https://lecabinetpartage.fr
    volumes:
      - sqlite-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-booking.rule=Host(`shared-booking.guillaumejacquart.com`) || Host(`lecabinetpartage.fr`) || Host(`www.lecabinetpartage.fr`)"
      - "traefik.http.routers.shared-booking.entrypoints=websecure"
      - "traefik.http.routers.shared-booking.tls=true"
      - "traefik.http.routers.shared-booking.tls.certresolver=myresolver"
      - "traefik.http.services.shared-booking.loadbalancer.server.port=3000"
volumes:
  sqlite-data:
