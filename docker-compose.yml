services:
  shared-booking:
    image: ghcr.io/guillaumejacquart/shared-booking:latest
    restart: unless-stopped
    # Secrets live only on the VPS, never in git.
    env_file:
      - /home/ubuntu/docker/services/shared-booking.env
    environment:
      - NODE_ENV=production
      - SQLITE_PATH=/app/data/shared-booking.db
      - BETTER_AUTH_URL=https://shared-booking.guillaumejacquart.com
    volumes:
      - sqlite-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-booking.rule=Host(`shared-booking.guillaumejacquart.com`)"
      - "traefik.http.routers.shared-booking.entrypoints=websecure"
      - "traefik.http.routers.shared-booking.tls=true"
      - "traefik.http.routers.shared-booking.tls.certresolver=myresolver"
      - "traefik.http.services.shared-booking.loadbalancer.server.port=3000"
volumes:
  sqlite-data:
