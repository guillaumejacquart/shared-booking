services:
  shared-booking:
    image: ghcr.io/guillaumejacquart/shared-booking:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SQLITE_PATH=/app/data/shared-booking.db
      - BETTER_AUTH_SECRET=
      - BETTER_AUTH_URL=https://resa.guillaumejacquart.com
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - EMAIL_FROM=noreply@guillaumejacquart.com
      - STRIPE_SECRET_KEY=
      - STRIPE_WEBHOOK_SECRET=
      - R2_ENDPOINT=
      - R2_ACCESS_KEY_ID=
      - R2_SECRET_ACCESS_KEY=
      - R2_BUCKET=shared-booking-backups
      - R2_PREFIX=sqlite
      - "BACKUP_SCHEDULE=0 3 * * *"
      - BACKUP_TIMEZONE=Europe/Paris
    volumes:
      - sqlite-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-booking.rule=Host(`resa.guillaumejacquart.com`)"
      - "traefik.http.routers.shared-booking.entrypoints=websecure"
      - "traefik.http.routers.shared-booking.tls=true"
      - "traefik.http.routers.shared-booking.tls.certresolver=myresolver"
      - "traefik.http.services.shared-booking.loadbalancer.server.port=3000"
volumes:
  sqlite-data:
